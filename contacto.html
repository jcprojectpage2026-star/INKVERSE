<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Inkverse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="assets/logo.png" alt="Logo Inkverse" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <section class="contacto-header">
    <h1>Contáctanos</h1>
    <p>¿Tienes una idea para tu prenda personalizada? Escríbenos.</p>
  </section>

  <section class="form-container">
    <form id="form-contacto">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required>

      <label for="telefono">Teléfono / WhatsApp</label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="producto">¿Qué te interesa?</label>
      <select id="producto" name="producto">
        <option value="sueter">Sueter personalizado</option>
        <option value="totebag">Totebag personalizada</option>
        <option value="accesorio">Accesorio</option>
        <option value="otro">Otro</option>
      </select>

      <label for="mensaje">Cuéntanos tu idea</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit" class="btn">Enviar mensaje</button>
    
<p id="aviso-form" class="aviso-form"></p>

    </form>
  </section>

  <footer>
    <p>&copy; 2026 Inkverse. Todos los derechos reservados.</p>
    <a href="https://www.instagram.com/inkverse_ctg" target="_blank">Síguenos en Instagram</a>
  </footer>
     </footer>

     <!-- CHATBOT -->
     <div id="chat-burbuja">💬</div>

     <div id="chat-caja" class="oculto">
       <div class="chat-header">
         <span>Inkbot 🐰</span>
         <span id="chat-cerrar">✕</span>
       </div>
       <div id="chat-mensajes"></div>
       <div class="chat-input-area">
         <input type="text" id="chat-input" placeholder="Escribe tu pregunta...">
         <button id="chat-enviar">➤</button>
       </div>
     </div>

     <script src="script.js"></script>
     <script type="module" src="contacto.js"></script>
   </body>
   </html>
</body>
</html>
